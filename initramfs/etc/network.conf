# Defaults; copy to /data/network.conf and edit to override.
# proto: dhcp or static (static uses ipaddr/netmask/gateway/dns)
proto=dhcp
ipaddr=192.168.15.11
netmask=255.255.255.0
gateway=192.168.15.1
dns="192.168.15.2 8.8.8.8"
# optional extra fixed address, e.g. fallback="192.168.1.20 netmask 255.255.255.0"
fallback=
hostname=dns
ntp=pool.ntp.org
